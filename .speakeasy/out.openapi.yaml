                  - "pose_tensorrt"
                  - "realesrgan_trt"
                  - "sharpen"
                  - "soft_edge"
                  - "standard_lineart"
                  - "temporal_net_tensorrt"
                  - "upscale"
              "preprocessor_params":
                description: "Preprocessor parameters"
                type: "object"
                additionalProperties: {}
              "enabled":
                description: "Whether this ControlNet is active. Disabled ControlNets are not loaded. Default: true"
                type: "boolean"
              "control_guidance_start":
                description: "Fraction of the denoising process (0.0-1.0) when ControlNet guidance begins. 0.0 means guidance starts from the beginning."
                type: "number"
                minimum: 0
                maximum: 1
              "control_guidance_end":
                description: "Fraction of the denoising process (0.0-1.0) when ControlNet guidance ends. 1.0 means guidance continues until the end."
                type: "number"
                minimum: 0
                maximum: 1
            required:
              - "model_id"
              - "conditioning_scale"
              - "preprocessor"
              - "enabled"
            additionalProperties: false
        "ip_adapter":
          description: "IP adapter — Turns on IP-Adapter style conditioning and is fully hot-swappable. Available for SDXL, SDXL-faceid, SD1.5"
          type: "object"
          properties:
            "type":
              description: "Type of IP adapter. Use 'faceid' for SDXL-faceid models, 'regular' for others"
              default: "regular"
              type: "string"
              enum:
                - "regular"
            "enabled":
              description: "Whether IP adapter is enabled"
              type: "boolean"
            "scale":
              description: "Strength of IP adapter style conditioning"
              type: "number"
            "weight_type":
              description: "Weight interpolation method for IP adapter style conditioning. Controls how the style influence changes throughout the generation process."
              type: "string"
              enum:
                - "linear"
                - "ease in"
                - "ease out"
                - "ease in-out"
                - "reverse in-out"
                - "weak input"
                - "weak output"
                - "weak middle"
                - "strong middle"
                - "style transfer"
                - "composition"
                - "strong style transfer"
                - "style and composition"
                - "style transfer precise"
                - "composition precise"
          required:
            - "type"
          additionalProperties: false
        "ip_adapter_style_image_url":
          description: "HTTPS URL or base64-encoded data URI (data:image/[type];base64,...) of the style image to use. Base64 images are automatically cached and uploaded to storage with content-based deduplication. Maximum size: 5MB. When set, the runtime downloads the image and configures the pipeline; if omitted, a default style image is used. For 'faceid' type, the image must contain a clear face. Available for SDXL, SDXL-faceid, SD1.5"
          type: "string"
        "cached_attention":
          description: "Cached attention (StreamV2V) configuration. Enable cached attention to reuse key/value tensors across frames. ⚠️ NOTE: Enabling or disabling cached_attention requires a pipeline reload as it uses a different pipeline."
          type: "object"
          properties:
            "enabled":
              description: "Whether this cached attention is active. Enable cached attention to reuse key/value tensors across frames."
              type: "boolean"
            "max_frames":
              description: "Number of frames retained in the attention cache. Number of historical K/V frames to retain. Limited by TensorRT engine exports."
              type: "integer"
              minimum: 1
              maximum: 4
            "interval":
              description: "Cadence (number of frames) for refreshing cached key/value tensors i.e How often (in number of frames) to refresh the cache.\n      It is now **frame-based** (not seconds). It accepts integers 1-240, representing how many frames elapse between cache refreshes.\n      "
              type: "integer"
              minimum: 1
              maximum: 240
          required:
            - "enabled"
            - "max_frames"
            - "interval"
          additionalProperties: false
      required:
        - "model_id"
      additionalProperties: false
