              description: "Whether this processor config is active"
              type: "boolean"
            "processors":
              description: "List of image processors to apply"
              type: "array"
              items:
                type: "object"
                properties:
                  "type":
                    type: "string"
                    enum:
                      - "blur"
                      - "canny"
                      - "depth"
                      - "depth_tensorrt"
                      - "external"
                      - "feedback"
                      - "hed"
                      - "lineart"
                      - "mediapipe_pose"
                      - "mediapipe_segmentation"
                      - "openpose"
                      - "passthrough"
                      - "pose_tensorrt"
                      - "realesrgan_trt"
                      - "sharpen"
                      - "soft_edge"
                      - "standard_lineart"
                      - "temporal_net_tensorrt"
                      - "upscale"
                  "enabled":
                    description: "Whether this processor is active"
                    type: "boolean"
                  "params":
                    type: "object"
                    additionalProperties: {}
                required:
                  - "type"
          required:
            - "processors"
