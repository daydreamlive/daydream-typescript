openapi: "3.1.0"
info:
  title: "Daydream API Documentation"
  description: "API documentation for Daydream API"
  version: "1.0.0"
components:
  securitySchemes:
    "Bearer":
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
  schemas:
    "SDTurbo":
      title: "SDTurbo"
      type: "object"
      properties:
        "model_id":
          type: "string"
          enum:
            - "stabilityai/sd-turbo"
        "prompt":
          description: "Text prompt describing the desired image. Can be a single string or weighted list of (prompt, weight) tuples."
          anyOf:
            - type: "string"
            - type: "array"
              items:
                type: "array"
                prefixItems:
                  - type: "string"
                    minLength: 1
                  - type: "number"
        "prompt_interpolation_method":
          description: "Method for interpolating between multiple prompts. Slerp provides smoother transitions than linear."
          type: "string"
          enum:
            - "linear"
            - "slerp"
        "normalize_prompt_weights":
          description: "Whether to normalize prompt weights to sum to 1.0 for consistent generation."
          type: "boolean"
        "normalize_seed_weights":
          description: "Whether to normalize seed weights to sum to 1.0 for consistent generation."
          type: "boolean"
        "negative_prompt":
          description: "Text describing what to avoid in the generated image."
          type: "string"
        "guidance_scale":
          description: "Strength of prompt adherence. Higher values make the model follow the prompt more strictly."
          type: "number"
        "delta":
          description: "Delta sets per-frame denoising progress: lower delta means steadier, less flicker but slower/softer; higher delta means faster, sharper but more flicker/artifacts (often reduce CFG)."
          type: "number"
        "num_inference_steps":
          description: "Builds the full denoising schedule (the 'grid' of possible refinement steps). Changing it changes what each step number (t_index_list value) means. Keep it fixed for a session and only adjust if you're deliberately redefining the schedule; if you do, proportionally remap your t_index_list. Typical range 10-100 with default being 50."
          type: "integer"
          minimum: 1
          maximum: 100
        "t_index_list":
          description: "The ordered list of step indices from the num_inference_steps schedule to execute per frame. Each index is one model pass, so latency scales with the list length. Higher indices (e.g., 40–49 on a 50-step grid) mainly polish and preserve structure (lower flicker), while lower indices (<20) rewrite structure (more flicker, creative). Values must be non-decreasing, and each between 0 and num_inference_steps.\n\n⚠️ NOTE: t_index_list must have 1–4 elements, non-decreasing, and within [0, num_inference_steps]. The value should not go above 50."
          minItems: 1
          maxItems: 4
          type: "array"
          items:
            type: "integer"
            minimum: -9007199254740991
            maximum: 9007199254740991
        "use_safety_checker":
          description: "Whether to use safety checker for content filtering"
          type: "boolean"
        "width":
          description: "Output image width in pixels. Must be divisible by 64 and between 384-1024."
          type: "integer"
          minimum: 384
          maximum: 1024
        "height":
          description: "Output image height in pixels. Must be divisible by 64 and between 384-1024."
          type: "integer"
          minimum: 384
          maximum: 1024
        "lora_dict":
          description: "Dictionary mapping LoRA model paths to their weights for fine-tuning the base model."
          type: "object"
          nullable: true
        "use_lcm_lora":
          description: "Whether to use Latent Consistency Model LoRA for faster inference."
          type: "boolean"
        "lcm_lora_id":
          description: "Identifier for the LCM LoRA model to use. Example: \"latent-consistency/lcm-lora-sdv1-5\""
          type: "string"
        "acceleration":
          description: "Acceleration method for inference. Options: \"none\", \"xformers\", \"tensorrt\". TensorRT provides the best performance but requires engine compilation."
          type: "string"
          enum:
            - "none"
            - "xformers"
            - "tensorrt"
        "use_denoising_batch":
          description: "Whether to process multiple denoising steps in a single batch for efficiency."
          type: "boolean"
        "do_add_noise":
          description: "Whether to add noise to input frames before processing. Enabling this slightly re-noises each frame to improve temporal stability, reduce ghosting/texture sticking, and prevent drift; disabling can yield sharper, lower-latency results but may increase flicker and artifact accumulation over time."
          type: "boolean"
        "seed":
          description: "Random seed for generation. Can be a single integer or weighted list of (seed, weight) tuples."
          anyOf:
            - type: "integer"
              minimum: -9007199254740991
              maximum: 9007199254740991
            - type: "array"
              items:
                type: "array"
                prefixItems:
                  - type: "integer"
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  - type: "number"
        "seed_interpolation_method":
          description: "Method for interpolating between multiple seeds. Slerp provides smoother transitions than linear."
          type: "string"
          enum:
            - "linear"
            - "slerp"
        "enable_similar_image_filter":
          description: "Whether to skip frames that are too similar to the previous output to reduce flicker."
          type: "boolean"
        "similar_image_filter_threshold":
          description: "Similarity threshold for the image filter. Higher values allow more variation between frames."
          type: "number"
          minimum: 0
          maximum: 1
        "similar_image_filter_max_skip_frame":
          description: "Maximum number of consecutive frames that can be skipped by the similarity filter."
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
        "skip_diffusion":
          description: "Whether to skip the diffusion process. Any ControlNets or diffusion-only parameters are ignored when enabled.\n        Example use cases:\n        - Stream the output of a preprocessor (e.g. live depth maps or pose skeletons),\n        - Run post-processors like RealESRGAN upscaler on externally provided frames,\n        - Warm a pipeline without paying the diffusion cost.\n      ⚠️ NOTE: skip_diffusion is evaluated at pipeline creation time; switching mid-stream triggers a pipeline reload.\n      "
          type: "boolean"
        "image_preprocessing":
          description: "List of image preprocessor configurations for image processing"
          type: "object"
          properties:
            "enabled":
              description: "Whether this processor config is active"
              type: "boolean"
            "processors":
              description: "List of image processors to apply"
              type: "array"
              items:
                type: "object"
                properties:
                  "type":
                    type: "string"
                    enum:
                      - "blur"
                      - "canny"
                      - "depth"
                      - "depth_tensorrt"
                      - "external"
                      - "feedback"
                      - "hed"
                      - "lineart"
                      - "mediapipe_pose"
                      - "mediapipe_segmentation"
                      - "openpose"
                      - "passthrough"
                      - "pose_tensorrt"
                      - "realesrgan_trt"
                      - "sharpen"
                      - "soft_edge"
                      - "standard_lineart"
                      - "temporal_net_tensorrt"
                      - "upscale"
                  "enabled":
                    description: "Whether this processor is active"
                    type: "boolean"
                  "params":
                    type: "object"
                    additionalProperties: {}
                required:
                  - "type"
          required:
            - "processors"
        "image_postprocessing":
          description: "List of image postprocessor configurations for image processing\n      ⚠️ NOTE: realesrgan_trt processor requires a restart to change because it affects resolution.\n      "
          type: "object"
          properties:
            "enabled":
              description: "Whether this processor config is active"
              type: "boolean"
            "processors":
              description: "List of image processors to apply"
              type: "array"
              items:
                type: "object"
                properties:
                  "type":
                    type: "string"
                    enum:
                      - "blur"
                      - "canny"
                      - "depth"
                      - "depth_tensorrt"
                      - "external"
                      - "feedback"
                      - "hed"
                      - "lineart"
                      - "mediapipe_pose"
                      - "mediapipe_segmentation"
                      - "openpose"
                      - "passthrough"
                      - "pose_tensorrt"
                      - "realesrgan_trt"
                      - "sharpen"
                      - "soft_edge"
                      - "standard_lineart"
                      - "temporal_net_tensorrt"
                      - "upscale"
                  "enabled":
                    description: "Whether this processor is active"
                    type: "boolean"
                  "params":
                    type: "object"
                    additionalProperties: {}
                required:
                  - "type"
          required:
            - "processors"
        "latent_preprocessing":
          description: "List of latent preprocessor configurations for latent processing"
          type: "object"
          properties:
            "enabled":
              description: "Whether this processor config is active"
              type: "boolean"
            "processors":
              description: "List of latent processors to apply"
              type: "array"
              items:
                type: "object"
                properties:
                  "type":
                    type: "string"
                    enum:
                      - "latent_feedback"
                  "enabled":
                    description: "Whether this processor is active"
                    type: "boolean"
                  "params":
                    type: "object"
                    additionalProperties: {}
                required:
                  - "type"
          required:
            - "processors"
        "latent_postprocessing":
          description: "List of latent postprocessor configurations for latent processing"
          type: "object"
          properties:
            "enabled":
              description: "Whether this processor config is active"
              type: "boolean"
            "processors":
              description: "List of latent processors to apply"
              type: "array"
              items:
                type: "object"
                properties:
                  "type":
                    type: "string"
                    enum:
                      - "latent_feedback"
                  "enabled":
                    description: "Whether this processor is active"
                    type: "boolean"
                  "params":
                    type: "object"
                    additionalProperties: {}
                required:
                  - "type"
          required:
            - "processors"
        "controlnets":
          description: "List of ControlNet configurations for guided generation. Each ControlNet provides different types of conditioning (pose, edges, depth, etc.). Dynamic updates limited to conditioning_scale changes only; cannot add new ControlNets or change model_id/preprocessor/params without reload."
          type: "array"
          items:
            type: "object"
            properties:
              "model_id":
                description: "⚠️ NOTE: ControlNet model_ids must be unique. Additionally, they must be compatible with the selected base model."
                type: "string"
                enum:
                  - "thibaud/controlnet-sd21-openpose-diffusers"
                  - "thibaud/controlnet-sd21-hed-diffusers"
                  - "thibaud/controlnet-sd21-canny-diffusers"
                  - "thibaud/controlnet-sd21-depth-diffusers"
                  - "thibaud/controlnet-sd21-color-diffusers"
                  - "daydreamlive/TemporalNet2-stable-diffusion-2-1"
              "conditioning_scale":
                description: "Strength of the ControlNet's influence on generation. Higher values make the model follow the control signal more strictly. Typical range 0.0-1.0, where 0.0 disables the control and 1.0 applies full control. Default: 1.0"
                type: "number"
                minimum: 0
                maximum: 1
              "preprocessor":
                description: "Preprocessor to apply to input frames before feeding to the ControlNet. Must be one of the supported preprocessors."
                type: "string"
                enum:
                  - "blur"
                  - "canny"
                  - "depth"
                  - "depth_tensorrt"
                  - "external"
                  - "feedback"
                  - "hed"
                  - "lineart"
                  - "mediapipe_pose"
                  - "mediapipe_segmentation"
                  - "openpose"
                  - "passthrough"
                  - "pose_tensorrt"
                  - "realesrgan_trt"
                  - "sharpen"
                  - "soft_edge"
                  - "standard_lineart"
                  - "temporal_net_tensorrt"
                  - "upscale"
              "preprocessor_params":
                description: "Additional parameters for the preprocessor. For example, canny edge detection uses 'low_threshold' and 'high_threshold' values."
                type: "object"
                additionalProperties: {}
              "enabled":
                description: "Whether this ControlNet is active. Disabled ControlNets are not loaded. Default: true"
                type: "boolean"
              "control_guidance_start":
                description: "Fraction of the denoising process (0.0-1.0) when ControlNet guidance begins. 0.0 means guidance starts from the beginning."
                type: "number"
                minimum: 0
                maximum: 1
              "control_guidance_end":
                description: "Fraction of the denoising process (0.0-1.0) when ControlNet guidance ends. 1.0 means guidance continues until the end."
                type: "number"
                minimum: 0
                maximum: 1
            required:
              - "model_id"
              - "conditioning_scale"
              - "preprocessor"
              - "enabled"
      required:
        - "model_id"
      additionalProperties: false
