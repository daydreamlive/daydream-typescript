          type: "object"
          properties:
            "type":
              description: "Type of IP adapter. Use 'faceid' for SDXL-faceid models, 'regular' for others"
              default: "regular"
              type: "string"
              enum:
                - "regular"
                - "faceid"
            "enabled":
              description: "Whether IP adapter is enabled"
              type: "boolean"
            "scale":
              description: "Strength of IP adapter style conditioning"
              type: "number"
            "weight_type":
              description: "Weight interpolation method for IP adapter style conditioning. Controls how the style influence changes throughout the generation process."
              type: "string"
              enum:
                - "linear"
                - "ease in"
                - "ease out"
                - "ease in-out"
                - "reverse in-out"
                - "weak input"
                - "weak output"
                - "weak middle"
                - "strong middle"
                - "style transfer"
                - "composition"
                - "strong style transfer"
                - "style and composition"
                - "style transfer precise"
