          type: "boolean"
        "normalize_seed_weights":
          description: "Whether to normalize seed weights to sum to 1.0 for consistent generation."
          type: "boolean"
        "negative_prompt":
          description: "Text describing what to avoid in the generated image."
          type: "string"
        "guidance_scale":
          description: "Strength of prompt adherence. Higher values make the model follow the prompt more strictly."
          type: "number"
        "delta":
          description: "Delta sets per-frame denoising progress: lower delta means steadier, less flicker but slower/softer; higher delta means faster, sharper but more flicker/artifacts (often reduce CFG)."
          type: "number"
        "num_inference_steps":
          description: "Builds the full denoising schedule (the 'grid' of possible refinement steps). Changing it changes what each step number (t_index_list value) means. Keep it fixed for a session and only adjust if you're deliberately redefining the schedule; if you do, proportionally remap your t_index_list. Typical range 10-100 with default being 50."
          type: "integer"
          minimum: 1
          maximum: 100
        "t_index_list":
          description: "The ordered list of step indices from the num_inference_steps schedule to execute per frame. Each index is one model pass, so latency scales with the list length. Higher indices (e.g., 40–49 on a 50-step grid) mainly polish and preserve structure (lower flicker), while lower indices (<20) rewrite structure (more flicker, creative). Values must be non-decreasing, and each between 0 and num_inference_steps.\n\n⚠️ NOTE: t_index_list must have 1–4 elements, non-decreasing, and within [0, num_inference_steps]. The value should not go above 50."
          minItems: 1
          maxItems: 4
          type: "array"
          items:
            type: "integer"
            minimum: -9007199254740991
            maximum: 9007199254740991
        "use_safety_checker":
